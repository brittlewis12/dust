[package]
name = "dustx"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.37", features = ["rt-multi-thread","macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
humantime = "2.1"
thiserror = "1.0"
indicatif = "0.17"
regex = "1.10"
notify = { version = "6.1", default-features = false, features = ["macos_kqueue", "serde"] }
dotenvy = "0.15"
walkdir = "2.5"
globset = "0.4"
similar = { version = "2.6", default-features = false, features = ["text","inline"] }
tokio-postgres = { version = "0.7", features = ["runtime"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls","json"] }
parking_lot = "0.12"
miette = { version = "7", features = ["fancy"] }

# Optional (to implement embedded PG auto-start in a follow-up)
postgresql_embedded = "0.18"
portpicker = "0.1"
# walkdir already included above; keep feature linkage only
zip = "2.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Depend on the local Core library crate
dust = { path = "../core" }

[features]

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
